services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trimssilver
      POSTGRES_PASSWORD: trimssilver
      POSTGRES_DB: trimssilver
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimssilver"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - stack.env
    environment:
      DATABASE_URL: postgresql://trimssilver:trimssilver@db:5432/trimssilver?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9087:3000"

volumes:
  db-data:
